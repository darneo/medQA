# Общие настройки тестов с выбором ответа на ru / kk. Данные: python scripts/get_benchmarks.py
dataset_path: json
output_type: multiple_choice
test_split: test
fewshot_split: dev
doc_to_choice: !function utils.doc_to_choice
doc_to_target: answer
target_delimiter: " "
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
